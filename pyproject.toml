[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-constellation"
version = "0.1.0"
description = "Turn your git history into a glowing star map (SVG)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
commit-constellation = "commit_constellation.cli:main"

[tool.setuptools]
packages = ["commit_constellation"]
